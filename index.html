<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <!-- Slick Slider CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- ==========================================================================
     STUDENT MOBILITY
     ========================================================================== -->

    <section class="student-mobility-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-5">
                    <div class="student-mobility-content">
                        <span class="student-mobility-badge">Student Mobility</span>
                        <h2 class="student-mobility-title">Student Moving -<br>both ways</h2>
                        <p class="student-mobility-desc">International students choose Parul for an Indian education. Parul students choose the world for a global one. Both routes are structured, supported, and fully credit-bearing.</p>
                    </div>
                </div>
                <div class="col-lg-7 position-relative">
                    <div class="student-mobility-image-wrapper">
                        <!-- Globe SVG background -->
                        <img src="assets/images/student-banner/student-mobility-globe.svg" alt="Globe" class="student-mobility-globe">
                        <!-- Hero Banner with students -->
                        <img src="assets/images/student-banner/student-mobility-hero-banner.webp" alt="Student Mobility" class="student-mobility-hero img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- jQuery and Slick JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <!-- Bootstrap Bundle JS -->
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
